name: GitHub-Profile-Summary-Cards

on:
  schedule:
    # 每天 UTC 18:00 = 北京时间 02:00
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    # 产物提交不再触发本体，避免自激循环
    paths-ignore:
      - "profile-summary-card-output/**"

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-cards
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 取分支最新 tip。默认会落在「触发事件的 SHA」上，
          # 远端若已有产物提交，末尾的 git push 会非快进被拒。
          ref: ${{ github.ref_name }}

      # 该 action 每次运行都会清空整个 profile-summary-card-output/ 再重建，
      # 所以两套主题必须分两次生成，中间把先跑的那套挪出输出目录。
      - name: 生成深色主题
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          TIME_ZONE: "Asia/Shanghai"
          THEME: "github_dark"
          ANIMATION: "rise"
          AUTO_PUSH: false

      - name: 暂存深色产物
        run: |
          set -euo pipefail
          rm -rf /tmp/cards-keep
          mkdir -p /tmp/cards-keep
          cp -r profile-summary-card-output/github_dark /tmp/cards-keep/

      - name: 生成浅色主题
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          TIME_ZONE: "Asia/Shanghai"
          THEME: "github"
          ANIMATION: "rise"
          AUTO_PUSH: false

      - name: 合并两套主题
        run: |
          set -euo pipefail
          cp -r /tmp/cards-keep/github_dark profile-summary-card-output/

      - name: 生成 Rank 圆环
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: node scripts/rank-card.mjs

      - name: 提交
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: 更新 GitHub 统计卡片"
          git push
