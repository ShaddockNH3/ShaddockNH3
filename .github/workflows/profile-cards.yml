name: GitHub-Profile-Summary-Cards

on:
  schedule:
    # 每天 UTC 18:00 = 北京时间 02:00
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    # 产物提交不再触发本体，避免自激循环
    paths-ignore:
      - "profile-summary-card-output/**"

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-cards
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 取分支最新 tip。默认会落在「触发事件的 SHA」上，
          # 远端若已有产物提交，生成完的 git push 会非快进被拒。
          ref: ${{ github.ref_name }}

      # THEME 必须留空（= 生成全部主题），不能拆成两次跑。
      # 该 action 每次都会清空整个 profile-summary-card-output/ 再重建，
      # 分成两个 job 时，后一个会把前一个的主题目录整片删掉。
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          TIME_ZONE: "Asia/Shanghai"
          THEME: ""
          ANIMATION: "rise"
          AUTO_PUSH: true
