name: GitHub-Profile-Cards

on:
  schedule:
    # 每天 UTC 18:00 = 北京时间 02:00
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    # 卡片提交不再触发本体，避免自激循环
    paths-ignore:
      - "profile-summary-card-output/**"

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-cards
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 取分支最新 tip。默认会落在「触发事件的 SHA」上，
          # 远端若已有卡片提交，末尾的 git push 会非快进被拒。
          ref: ${{ github.ref_name }}

      - name: 生成卡片（stats / langs）
        env:
          PAT_1: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
          TARGET_USER: ${{ github.repository_owner }}
          GHS_DIR: ${{ runner.temp }}/github-readme-stats
        run: |
          set -euo pipefail
          # 直接用 github-readme-stats 上游代码渲染，不自己仿排版。
          # 只装 5 个运行时依赖，忽略 postinstall。
          git clone --depth 1 https://github.com/anuraghazra/github-readme-stats.git "$GHS_DIR"
          npm install --prefix "$GHS_DIR" --omit=dev --ignore-scripts --no-audit --no-fund
          node scripts/github-cards.mjs

      - name: 提交
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: 更新 GitHub 卡片"
          git push
