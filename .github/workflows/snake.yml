name: Generate Snake

on:
  schedule:
    # 每天 UTC 19:00 = 北京时间 03:00，跟统计卡错开
    - cron: "0 19 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      # 只在自己被改动时跑，日常提交不打扰
      - ".github/workflows/snake.yml"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      # 从贡献图生成贪吃蛇动画，产出两张 SVG（浅色 / 深色）
      - name: 生成贪吃蛇
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      # 推到 output 分支，避免污染 main
      - name: 发布到 output 分支
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
